<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第個網站</title>
</head>
<body>
    <main>
        <h1>網頁</h1>
        <p>網頁是全球諮詢網上，可以用瀏覽器文曲的檔案</p>
        <section>
            <h2>網址</h2>
            <p>每⼀個放在網路上的網⾴都有⼀個網址，正式的名稱叫做</p>
            <p>只需在瀏覽器上輸⼊網⾴的 URL，便可以顯⽰這個網⾴。</p>
        </section>
        <section>
            <h2>元素</h2>
            <p>網⾴由多個元素構成，例如：</p>
            <ul>
                <li>標題元素</li>
                <li>段落元素</li>
                <li>圖像元素</li>
            </ul>
        </section>
    </main>
</body>
</html>
